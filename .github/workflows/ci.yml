name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The rev-pinned git dependencies (sigil, xstate-ir) fetch through the git
  # CLI so actions/checkout's persisted credentials authenticate private
  # repos; cargo's default libgit2 backend carries no credentials.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # The dsntk dependency tree pushed the full --all-targets build past the
  # runner's disk budget (the linker Bus-errors when the disk fills); CI
  # builds without incremental compilation and without debuginfo, which
  # keeps target/ tens of GB smaller without changing any test's semantics.
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  # Advisory + license/supply-chain gates (WI-5 of v0.2, issue #173).
  # Kept as separate fast jobs: a red audit must not block unrelated test
  # signal, and neither job builds the workspace.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    runs-on: ubuntu-latest
    env:
      # The rev-pinned git deps (sigil, xstate-ir, dsntk) fetch through the
      # git CLI with checkout's persisted credentials — cargo-deny reads
      # their sources for the license check, and restingstate is private.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The full workspace build + scratch-crate e2e + doctest linking
      # exceed the runner's default free disk, and lld dies with SIGBUS
      # writing mmap'd output when it fills (`ld terminated with signal 7`
      # in the Doc-tests section). The preinstalled toolchains we don't use
      # are tens of GB. The dsntk dependency tree (chrono-tz, the icu data
      # crates, dfp-number-sys) grew the dep tree enough that the default
      # dev profile no longer fits either: CI builds with incremental
      # compilation and debuginfo disabled (job env below), which keeps
      # target/ tens of GB smaller without changing any test's semantics.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc             /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift /usr/local/share/powershell /usr/local/julia /usr/local/lib/R /usr/local/share/chromium /opt/microsoft || true
          sudo apt-get clean || true
          sudo docker image prune -af || true
          df -h / /tmp
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: scripts/ci-local.sh build
      # Every gate below invokes scripts/ci-local.sh — the single source
      # of truth for the gate sequence and the fixture-glob list (issue
      # #121): local and remote can never drift. Step boundaries match the
      # script's subcommands 1:1 so the Actions view stays legible.
      # rustdoc links doctest artifacts under TMPDIR, which defaults to
      # the small tmpfs /tmp — the linker SIGBUSes there (the AGENTS.md
      # testing-quirks gotcha; `ld terminated with signal 7`). The script
      # points TMPDIR at the disk-backed target/ and caps the job count so
      # the eleven rex-driver doctests don't link concurrently.
      - name: Tests
        run: scripts/ci-local.sh test
      - name: Clippy
        run: scripts/ci-local.sh clippy
      - name: Format check
        run: scripts/ci-local.sh fmt
      # The verification receipt is a golden (issue #207): regenerate it from
      # the sources it names and byte-compare with the committed file, so a
      # source, artifact, or register change without regeneration is red.
      - name: Receipt freshness
        run: scripts/ci-local.sh receipt
      # Broken intra-doc links are warnings by default; -D warnings makes
      # them errors so the gate stays visible (issue #175). cargo doc runs
      # no doctests, so it needs no TMPDIR dance.
      - name: Docs
        run: scripts/ci-local.sh docs
