[workspace]
resolver = "2"
members = [
    "crates/rex-syntax",
    "crates/rex-ir",
    "crates/rex-expr",
    "crates/rex-ifml",
    "crates/rex-driver",
    "crates/rex-backend-rust",
    "crates/rex-backend-jsonschema",
    "crates/rex-backend-cedar",
    "crates/rex-backend-cmmn",
    "crates/rex-backend-dmn",
    "crates/rex-backend-common",
    "crates/rex-vocab",
    "crates/rex-lsp",
    "crates/rex-runtime",
    "crates/rex-cli",
    "crates/rex-verify",
    "crates/rex-diagnostics",
    "crates/rex-evidence",
    "crates/rex-strings",
    "crates/rex-dates",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "rexlang: a multi-target modeling language inspired by Eclipse Xcore"
repository = "https://github.com/yestechgroup/rexlang"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
rex-syntax = { path = "crates/rex-syntax" }
rex-ir = { path = "crates/rex-ir" }
rex-expr = { path = "crates/rex-expr" }
rex-ifml = { path = "crates/rex-ifml" }
rex-driver = { path = "crates/rex-driver" }
rex-backend-rust = { path = "crates/rex-backend-rust" }
rex-backend-jsonschema = { path = "crates/rex-backend-jsonschema" }
rex-backend-cedar = { path = "crates/rex-backend-cedar" }
rex-backend-common = { path = "crates/rex-backend-common" }
rex-vocab = { path = "crates/rex-vocab" }
rex-lsp = { path = "crates/rex-lsp" }
rex-runtime = { path = "crates/rex-runtime" }
rex-verify = { path = "crates/rex-verify" }
rex-diagnostics = { path = "crates/rex-diagnostics" }
rex-evidence = { path = "crates/rex-evidence" }
rex-strings = { path = "crates/rex-strings" }
rex-dates = { path = "crates/rex-dates" }

# The Rune DSL (`.rosetta`) toolchain, pinned by rev — the embedding
# contract is documented in sigil's docs/api-stability.md (sigil-model is
# the compatibility boundary).
sigil-diag = { git = "https://github.com/yestechgroup/sigil.git", rev = "69115a79999e6ff2ce04c039a71edac6d8ba2468" }
sigil-model = { git = "https://github.com/yestechgroup/sigil.git", rev = "69115a79999e6ff2ce04c039a71edac6d8ba2468" }
sigil-resolve = { git = "https://github.com/yestechgroup/sigil.git", rev = "69115a79999e6ff2ce04c039a71edac6d8ba2468" }
sigil-syntax = { git = "https://github.com/yestechgroup/sigil.git", rev = "69115a79999e6ff2ce04c039a71edac6d8ba2468" }

# The restingstate statechart toolchain, pinned by rev — `.ddd` state
# machines lower into its language-neutral Machine IR (xstate-ir is the
# compatibility boundary; the lowering contract lives in docs/DDD.md).
# NOTE: restingstate is a private repo; CI needs credentials to fetch it.
xstate-ir = { git = "https://github.com/yestechgroup/restingstate.git", rev = "380580b6407f6530c6fb89e1ce87621567f009c5" }

# The dsntk decision-table toolchain (yestechgroup fork of DecisionToolkit/dsntk),
# pinned by rev — the `.dmn` surface validates external markdown decision tables
# through dsntk-recognizer (`from_markdown`) and FEEL expression syntax through
# dsntk-feel-parser. The validation contract lives in `crates/rex-driver/src/dmn.rs`
# and `docs/DMN.md`; the recognizer's decision-table type is the
# compatibility boundary (rex-ir stays ours).
dsntk-recognizer = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }
dsntk-model = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }
dsntk-model-evaluator = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }
dsntk-common = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }
rex-backend-dmn = { path = "crates/rex-backend-dmn" }
dsntk-feel = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }
dsntk-feel-parser = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }
dsntk-feel-evaluator = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }

anyhow = "1.0"
ariadne = "0.6"
chumsky = "0.10"
clap = { version = "4.5", features = ["derive"] }
jsonschema = "0.61"
creusot-std = "0.14.0"
logos = "0.15"
pest = "2"
pest_derive = "2"
proptest = "1.11"
salsa = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
slotmap = "1.0"
thiserror = "2.0"
tower-lsp-server = "0.23"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
ureq = "3.4"
walkdir = "2.5"
clap_complete = "4.6"
clap_mangen = "0.3"
