[workspace]
resolver = "2"
members = [
    "crates/rex-syntax",
    "crates/rex-ir",
    "crates/rex-expr",
    "crates/rex-ifml",
    "crates/rex-driver",
    "crates/rex-backend-rust",
    "crates/rex-backend-jsonschema",
    "crates/rex-backend-cedar",
    "crates/rex-vocab",
    "crates/rex-lsp",
    "crates/rex-runtime",
    "crates/rex-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "rexlang: a multi-target modeling language inspired by Eclipse Xcore"
repository = "https://github.com/yestechgroup/rexlang"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
rex-syntax = { path = "crates/rex-syntax" }
rex-ir = { path = "crates/rex-ir" }
rex-expr = { path = "crates/rex-expr" }
rex-ifml = { path = "crates/rex-ifml" }
rex-driver = { path = "crates/rex-driver" }
rex-backend-rust = { path = "crates/rex-backend-rust" }
rex-backend-jsonschema = { path = "crates/rex-backend-jsonschema" }
rex-backend-cedar = { path = "crates/rex-backend-cedar" }
rex-vocab = { path = "crates/rex-vocab" }
rex-lsp = { path = "crates/rex-lsp" }
rex-runtime = { path = "crates/rex-runtime" }

anyhow = "1.0"
ariadne = "0.5"
askama = "0.14"
chumsky = "0.10"
clap = { version = "4.5", features = ["derive"] }
jsonschema = "0.55"
logos = "0.15"
pest = "2"
pest_derive = "2"
proptest = "1.11"
salsa = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
slotmap = "1.0"
thiserror = "2.0"
tower-lsp = "0.20"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
ureq = "3.4"
