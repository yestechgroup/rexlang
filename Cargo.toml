[workspace]
resolver = "2"
members = [
    "crates/rex-syntax",
    "crates/rex-ir",
    "crates/rex-driver",
    "crates/rex-backend-rust",
    "crates/rex-runtime",
    "crates/rex-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
rex-syntax = { path = "crates/rex-syntax" }
rex-ir = { path = "crates/rex-ir" }
rex-driver = { path = "crates/rex-driver" }
rex-backend-rust = { path = "crates/rex-backend-rust" }
rex-runtime = { path = "crates/rex-runtime" }

anyhow = "1.0"
ariadne = "0.5"
askama = "0.14"
chumsky = "0.10"
clap = { version = "4.5", features = ["derive"] }
logos = "0.15"
salsa = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slotmap = "1.0"
thiserror = "2.0"
