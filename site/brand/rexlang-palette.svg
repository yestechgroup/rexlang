<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" role="img" aria-label="Rexlang palette">
  <title>Rexlang palette</title>
  <rect width="940" height="250" fill="#F5F4F0"/>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">
    <g transform="translate(20 20)">
      <rect width="140" height="120" fill="#111318"/>
      <text x="0" y="145" fill="#111318" font-weight="600">Graphite</text>
      <text x="0" y="162" fill="#5A616B">#111318</text>
      <text x="0" y="179" fill="#5A616B">surface / text</text>
    </g>
    <g transform="translate(180 20)">
      <rect width="140" height="120" fill="#1C2028"/>
      <text x="0" y="145" fill="#111318" font-weight="600">Charcoal</text>
      <text x="0" y="162" fill="#5A616B">#1C2028</text>
      <text x="0" y="179" fill="#5A616B">raised surface</text>
    </g>
    <g transform="translate(340 20)">
      <rect width="140" height="120" fill="#F5F4F0" stroke="#111318" stroke-opacity="0.12"/>
      <text x="0" y="145" fill="#111318" font-weight="600">Warm white</text>
      <text x="0" y="162" fill="#5A616B">#F5F4F0</text>
      <text x="0" y="179" fill="#5A616B">reading surface</text>
    </g>
    <g transform="translate(500 20)">
      <rect width="140" height="120" fill="#A7ADB7"/>
      <text x="0" y="145" fill="#111318" font-weight="600">Silver</text>
      <text x="0" y="162" fill="#5A616B">#A7ADB7</text>
      <text x="0" y="179" fill="#5A616B">borders, decoration</text>
    </g>
    <g transform="translate(660 20)">
      <rect width="140" height="120" fill="#C4F56A"/>
      <text x="0" y="145" fill="#111318" font-weight="600">Electric lime</text>
      <text x="0" y="162" fill="#5A616B">#C4F56A</text>
      <text x="0" y="179" fill="#5A616B">accent / CTA fill</text>
    </g>
    <g transform="translate(820 20)">
      <rect width="100" height="120" fill="#5369D8"/>
      <text x="0" y="145" fill="#111318" font-weight="600">Deep blue</text>
      <text x="0" y="162" fill="#5A616B">#5369D8</text>
      <text x="0" y="179" fill="#5A616B">diagrams only</text>
    </g>
  </g>
</svg>
